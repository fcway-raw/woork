/* ===================== 引擎工具 & 角色（SVG） ===================== */
const NS='http://www.w3.org/2000/svg';
const C={cream:'#faf7f2',ink:'#2b2b2b',g:'#43a047',y:'#f0b429',r:'#e57373',b:'#5c85d6',purple:'#9b6bd6',gold:'#e0a82e'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const ebk=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(lt,a,d)=>clamp((lt-a)/d);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const T=(s,fs=40,fill=C.ink,x=0,y=0,ex='')=>`<text x="${x}" y="${y}" font-size="${fs}" fill="${fill}" text-anchor="middle" dominant-baseline="central" ${ex}>${s}</text>`;

let CUR=null;
/* add(svgHtml,{x,y,s,rot,at,out,kind,dur,tick})  时间均为“场景内秒” */
function add(html,o={}){
  const g=document.createElementNS(NS,'g');
  g.innerHTML=html;
  g.style.display='none';
  CUR.root.appendChild(g);
  const e=Object.assign({g,x:0,y:0,s:1,sx:1,rot:0,at:0,out:null,kind:'pop',dur:.5,tick:null},o);
  e.q=[...g.querySelectorAll('[data-a]')];
  CUR.els.push(e);
  return e;
}
function updEl(e,lt){
  const vis=lt>=e.at && (e.out==null || lt<e.out+.35);
  if(!vis){e.g.style.display='none';return;}
  e.g.style.display='';
  const p=clamp((lt-e.at)/e.dur);
  let op=1,sc=1,dx=0,dy=0,rot=e.rot,sx=e.sx;
  const k=eo(p);
  switch(e.kind){
    case 'pop':sc=ebk(p);op=Math.min(1,p*4);break;
    case 'up':dy=(1-k)*80;op=k;break;
    case 'down':dy=-(1-k)*80;op=k;break;
    case 'left':dx=-(1-k)*260;op=k;break;
    case 'right':dx=(1-k)*260;op=k;break;
    case 'drop':dy=-(1-k)*300;op=Math.min(1,p*4);break;
    case 'fade':op=p;break;
    case 'zoom':sc=lerp(.5,1,k);op=k;break;
    case 'none':break;
  }
  if(e.out!=null && lt>e.out){const q=clamp((lt-e.out)/.3);op*=1-q;if(e.outKind==='shrink')sc*=1-q;}
  if(e.tick){
    const r=e.tick(lt-e.at,e,lt)||{};
    if(r.dx)dx+=r.dx;if(r.dy)dy+=r.dy;if(r.rot)rot+=r.rot;
    if(r.ds!=null)sc*=r.ds;if(r.op!=null)op*=r.op;if(r.sx!=null)sx*=r.sx;
  }
  e.g.setAttribute('transform',`translate(${(e.x+dx).toFixed(2)} ${(e.y+dy).toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${(e.s*sc*sx).toFixed(4)} ${(e.s*sc).toFixed(4)})`);
  e.g.setAttribute('opacity',op.toFixed(3));
}
const arrow=(x1,y1,x2,y2,col=C.ink,w=8)=>{const a=Math.atan2(y2-y1,x2-x1),h=w*2.8;const bx=x2-Math.cos(a)*h*.6,by=y2-Math.sin(a)*h*.6;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${x2},${y2} ${x2-Math.cos(a-.5)*h},${y2-Math.sin(a-.5)*h} ${x2-Math.cos(a+.5)*h},${y2-Math.sin(a+.5)*h}" fill="${col}"/>`};
const xmark=(sz=60,col=C.r,w=16)=>`<g stroke="${col}" stroke-width="${w}" stroke-linecap="round"><line x1="${-sz}" y1="${-sz}" x2="${sz}" y2="${sz}"/><line x1="${sz}" y1="${-sz}" x2="${-sz}" y2="${sz}"/></g>`;
const check=(sz=60,col=C.g,w=16)=>`<polyline points="${-sz},0 ${-sz*.3},${sz*.7} ${sz},${-sz*.7}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

  <ellipse cx="${-r*.42}" cy="${-r*.58}" rx="${r*.2}" ry="${r*.1}" fill="#fff" opacity=".5" transform="rotate(-35 ${-r*.42} ${-r*.58})"/>

  <circle cx="${-r*.3}" cy="${-r*.12}" r="${r*.035}" fill="#fff"/><circle cx="${r*.36}" cy="${-r*.12}" r="${r*.035}" fill="#fff"/>
  <circle cx="${-r*.58}" cy="${r*.2}" r="${r*.17}" fill="${hot?'#e04b4b':'#ff9e80'}" opacity="${hot?.95:.6}"/><circle cx="${r*.58}" cy="${r*.2}" r="${r*.17}" fill="${hot?'#e04b4b':'#ff9e80'}" opacity="${hot?.95:.6}"/>
  ${hot?`<path d="M${-r*.2} ${r*.42} Q0 ${r*.22} ${r*.2} ${r*.42}" fill="none" stroke="#2b2b2b" stroke-width="${r*.05}" stroke-linecap="round"/>
  <path d="M${-r*.5} ${-r*.3} L${-r*.18} ${-r*.22}" stroke="#2b2b2b" stroke-width="${r*.05}" stroke-linecap="round"/><path d="M${r*.5} ${-r*.3} L${r*.18} ${-r*.22}" stroke="#2b2b2b" stroke-width="${r*.05}" stroke-linecap="round"/>
  <path d="M${r*.78} ${-r*.35} q${r*.1} ${r*.16} 0 ${r*.24} q${-r*.1} ${-r*.08} 0 ${-r*.24}z" fill="#8fd3f4"/>`
  :`<path d="M${-r*.22} ${r*.2} Q0 ${r*.44} ${r*.22} ${r*.2}" fill="none" stroke="#2b2b2b" stroke-width="${r*.05}" stroke-linecap="round"/>`}
  </g>`;
}
const smokeHtml=()=>[0,1,2].map(i=>`<path data-a="s" d="M0 0 c 20 -16 -20 -30 0 -46 s 20 -30 0 -46" fill="none" stroke="#9aa0a6" stroke-width="10" stroke-linecap="round"/>`).join('');
function smokeTick(lt,e,spd=.45,h=140){e.q.forEach((p,i)=>{const ph=((lt*spd+i/3)%1+1)%1;p.setAttribute('transform',`translate(${((i-1)*30+Math.sin(ph*7+i*2)*8).toFixed(1)} ${(-ph*h).toFixed(1)}) scale(${(.6+ph*.6).toFixed(3)})`);p.setAttribute('opacity',(Math.sin(Math.PI*ph)*.8).toFixed(3));});}
function flame(){return `<g><path d="M0 -70 C 8 -45 34 -35 30 -12 C 27 6 12 12 0 12 C -12 12 -27 6 -30 -12 C -34 -35 -8 -45 0 -70Z" fill="#f39c3d"/><path d="M0 -38 C 5 -25 18 -20 16 -6 C 14 4 6 7 0 7 C -6 7 -14 4 -16 -6 C -18 -20 -5 -25 0 -38Z" fill="#ffd54f"/></g>`}
const flick=(lt)=>({ds:1+Math.sin(lt*9)*.06,rot:Math.sin(lt*7)*4});

  add(smokeHtml(),{x:470,y:480,s:1.3,at:b[4]+.3,out:b[5],kind:'none',tick:(lt,el,abs)=>{smokeTick(lt,el,.45,140);return{op:1-eo(seg(abs,b[4]+.8,1.6))}}});
  add(lockHtml(),{x:1010,y:640,s:.95,at:b[4]+.5,out:b[5],kind:'pop',tick:(lt,el,abs)=>{const p=eio(seg(abs,b[4]+1.6,.8));el.q[0].setAttribute('transform',`rotate(${-p*28} -44 -50) translate(0 ${-p*30})`);}});
  add(keyHtml(),{x:830,y:654,s:.95,at:b[4]+.7,out:b[5],kind:'left',tick:(lt,el,abs)=>({sx:Math.cos(Math.PI*eio(seg(abs,b[4]+1.2,.8)))})});
  const nodes=[['内脏脂肪 ↓',-90],['发炎指标 ↓',30],['肠道屏障 ↑',150]];
  add(`<g data-a="ring"><circle r="150" fill="none" stroke="${C.g}" stroke-width="14" stroke-dasharray="120 40" stroke-linecap="round"/></g>`,{x:1550,y:610,at:b[4]+2.0,out:b[5],kind:'pop',tick:(lt,el)=>{el.q[0].setAttribute('transform',`rotate(${(lt*40).toFixed(1)})`);}});
  add(T('🔁',90),{x:1550,y:610,at:b[4]+2.0,out:b[5],kind:'pop'});
  [[0,-1],[1,.5],[2,.5]].forEach(()=>0);
  [['脂肪 ↓',-90,-190],['发炎 ↓',150,90],['屏障 ↑',-150,90]].forEach(([t,dx,dy],i)=>add(`<g><rect x="-88" y="-34" width="176" height="68" rx="34" fill="#fff" stroke="${C.g}" stroke-width="6"/>${T(t,38)}</g>`,{x:1550+ (i===0?0:dx*1.0),y:610+(i===0?-190:dy*1.0),at:b[4]+2.4+i*.4,out:b[5],kind:'pop'}));
  /* B5：结尾卡 */
  add(`<g>${T('🚨',130)}${xmark(80,C.r,18)}</g>`,{x:560,y:640,at:b[5]+.6,kind:'pop'});
  add(T('过敏',48,'#8a8377'),{x:560,y:760,at:b[5]+.9,kind:'fade'});
  add(arrow(-110,0,110,0,C.b,14),{x:960,y:640,at:b[5]+1.2,kind:'fade'});

  add(flame(),{x:1520,y:715,s:.9,at:b[5]+1.6,kind:'pop',tick:flick});

/* ===================== 引擎：seek / UI / 播放 ===================== */
const params=new URLSearchParams(location.search);
const RENDER=params.get('render')==='1';
if(RENDER)document.body.classList.add('render');
const $=id=>document.getElementById(id);
const svg=$('svg'),stage=$('stage');
const ICON={animal:'🐭 动物实验',cell:'🧫 细胞实验',human:'👥 人体研究',case:'👤 个案'};

function layout(){
  SCENES.forEach(s=>{
    const n=s.beats.length,D=s.end-s.start,MIN=Math.min(3.5,D/n);
    const lens=s.beats.map(bt=>Math.max(bt.sub.replace(/\*\*/g,'').length,6));
    const sum=lens.reduce((a,c)=>a+c,0),extra=Math.max(0,D-MIN*n);
    let t=s.start;
    s.beats.forEach((bt,i)=>{const d=MIN+extra*lens[i]/sum;bt.start=t;bt.end=(i===n-1)?s.end:t+d;t+=d;});
  });
}
const fmt=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const plain=x=>x.replace(/\*\*/g,'');
function build(){
  SCENES.forEach((S,si)=>{
    const root=document.createElementNS(NS,'g');root.style.display='none';svg.appendChild(root);
    CUR={root,els:[]};S.root=root;S.els=CUR.els;
    S.bt=S.beats.map(x=>x.start-S.start);S.be=S.beats.map(x=>x.end-S.start);
    BUILD[si](S.bt,S.be);
  });
  window.__BEATS=SCENES.flatMap(S=>S.beats.map((x,i)=>({scene:S.id,beat:i,start:x.start,end:x.end})));
}
const measure=document.createElement('span');measure.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font-weight:700;left:-9999px';
let lastKey=null,lastFit={};
function fitFont(html,max){
  const k=html+'|'+max;if(lastFit[k])return lastFit[k];
  document.body.appendChild(measure);measure.innerHTML=html;
  let fs=max;measure.style.fontSize=fs+'px';
  while(measure.offsetWidth>1700-110&&fs>40){fs-=2;measure.style.fontSize=fs+'px';}
  document.body.removeChild(measure);lastFit[k]=fs;return fs;
}
function seek(t){
  t=clamp(t,0,DURATION-1e-4);
  let si=SCENES.findIndex(s=>t>=s.start&&t<s.end);if(si<0)si=SCENES.length-1;
  const S=SCENES[si],lt=t-S.start;
  SCENES.forEach((s,i)=>{s.root.style.display=i===si?'':'none';});
  const inP=eo(lt/.5),outP=clamp((S.end-t)/.35);
  S.root.setAttribute('transform',`translate(${((1-inP)*90).toFixed(1)} 0)`);
  S.root.setAttribute('opacity',(inP*Math.min(1,outP)).toFixed(3));
  S.els.forEach(e=>updEl(e,lt));
  // beat
  let bi=S.beats.findIndex(x=>t>=x.start&&t<x.end);if(bi<0)bi=S.beats.length-1;
  const B=S.beats[bi],key=si+'-'+bi;
  if(key!==lastKey){
    lastKey=key;
    $('chip').textContent=S.chip;
    $('badges').innerHTML=(B.badge||[]).map(([ty,c])=>`<div class="badge ${ty}">${ICON[ty]}${c?`<small>${c}</small>`:''}</div>`).join('');
    const bn=$('banner');bn.className=B.card?'card':'';
    const col={red:C.r,yellow:C.y,green:C.g}[B.card];
    if(col)bn.style.setProperty('--c',col);
    bn.style.top=(B.pos==='center'?'250px':'118px');bn.style.height=(B.pos==='center'?'200px':'112px');
    const sp=bn.firstElementChild;
    if(B.text){const h=fmt(B.text);const max=B.pos==='center'?96:(B.card?70:76);sp.innerHTML=h;sp.style.fontSize=fitFont(h,max)+'px';sp.style.display='';}else sp.style.display='none';
    $('sub').firstElementChild.innerHTML=fmt(B.sub);
  }
  const bl=t-B.start;
  const bp=ebk(clamp(bl/.5));
  $('banner').style.opacity=Math.min(1,bl/.25).toFixed(3);
  $('banner').style.transform=`scale(${(0.6+0.4*bp).toFixed(3)})`;
  $('sub').firstElementChild.style.opacity=Math.min(1,bl/.3).toFixed(3);
  $('chip').style.opacity=Math.min(1,lt/.4).toFixed(3);
  $('progbar').style.width=(t/DURATION*1920).toFixed(1)+'px';
  if(!RENDER){$('rng').value=t;$('tm').textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');}
}
function init(){
  layout();build();
  SCENES.forEach(s=>{if(s.start>0){const i=document.createElement('i');i.style.left=(s.start/DURATION*1920)+'px';$('prog').appendChild(i);}});
  if(!RENDER){
    SCENES.forEach(s=>{const bt=document.createElement('button');bt.textContent='第'+s.id+'幕';bt.onclick=()=>{cur=s.start+.01;seek(cur);};$('scenes').appendChild(bt);});
    const fit=()=>{const w=innerWidth,h=innerHeight-56;const sc=Math.min(w/1920,h/1080);stage.style.transform=`scale(${sc})`;stage.style.left=((w-1920*sc)/2)+'px';stage.style.top='0px';};
    fit();addEventListener('resize',fit);
    let playing=false,last=0;cur=parseFloat(params.get('t')||'0');
    const step=(ts)=>{if(playing){cur+=(ts-last)/1000;last=ts;if(cur>=DURATION){cur=DURATION-.01;playing=false;$('pp').textContent='▶ 播放';}seek(cur);}requestAnimationFrame(step);};
    $('pp').onclick=()=>{playing=!playing;last=performance.now();$('pp').textContent=playing?'⏸ 暂停':'▶ 播放';};
    $('rng').oninput=e=>{cur=parseFloat(e.target.value);seek(cur);};
    addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('pp').click();}if(e.code==='ArrowRight'){cur+=5;seek(cur);}if(e.code==='ArrowLeft'){cur-=5;seek(cur);}});
    requestAnimationFrame(step);
  }else{stage.style.transform='none';stage.style.left='0';stage.style.top='0';}
  seek(cur||0);
  window.__ready=true;
}
let cur=0;
window.__seek=seek;
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(init);
</script>
