<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif"><rect x="0" y="0" width="900" height="400" rx="24" fill="#FFF8F0"/><text x="450.0" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#3A3330">工作和生活「分开」，其实没有很久</text><path d="M261.15 110.01 A110 110 0 0 1 355.83 274.00" fill="none" stroke="#F2A541" stroke-width="80"/><text x="355.3" y="161.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">工作</text><text x="355.3" y="181.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">8 小时</text><path d="M354.68 275.99 A110 110 0 0 1 165.32 275.99" fill="none" stroke="#5DADE2" stroke-width="80"/><text x="260.0" y="326.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">休息</text><text x="260.0" y="346.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">8 小时</text><path d="M164.17 274.00 A110 110 0 0 1 258.85 110.01" fill="none" stroke="#6DBE8C" stroke-width="80"/><text x="164.7" y="161.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">自己</text><text x="164.7" y="181.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">8 小时</text><text x="260.0" y="228.0" text-anchor="middle" font-size="26" font-weight="700" fill="#3A3330">24h</text><text x="560.0" y="160.0" text-anchor="start" font-size="22" font-weight="700" fill="#3A3330">1817 年 · 工厂时代</text><text x="560.0" y="200.0" text-anchor="start" font-size="18" font-weight="400" fill="#8A7F78">Robert Owen 提出</text><text x="560.0" y="228.0" text-anchor="start" font-size="18" font-weight="400" fill="#8A7F78">「8 小时工作、8 小时休息、</text><text x="560.0" y="256.0" text-anchor="start" font-size="18" font-weight="400" fill="#8A7F78">  8 小时做自己的事」</text><text x="560.0" y="304.0" text-anchor="start" font-size="19" font-weight="700" fill="#3A3330">👉 为了保护工人才画的线</text></svg>