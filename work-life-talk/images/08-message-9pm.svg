<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif"><rect x="0" y="0" width="920" height="470" rx="24" fill="#FFF8F0"/><text x="460.0" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#3A3330">同样是晚上九点回 message</text><rect x="110" y="80" width="310" height="320" rx="32" fill="#fff" stroke="#E8DDD3" stroke-width="3"/><text x="265.0" y="126.0" text-anchor="middle" font-size="20" font-weight="700" fill="#8A7F78">🕘 21:00</text><rect x="135" y="150" width="260" height="90" rx="18" fill="#FDE3E2"/><text x="265.0" y="188.0" text-anchor="middle" font-size="17" font-weight="700" fill="#3A3330">唉，真的不想回……</text><text x="265.0" y="216.0" text-anchor="middle" font-size="17" font-weight="700" fill="#3A3330">可是不回不行。</text><text x="265.0" y="310.0" text-anchor="middle" font-size="54" font-weight="400" fill="#3A3330">😩</text><rect x="205" y="340" width="120" height="36" rx="18" fill="#EF6F6C"/><text x="265.0" y="364.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">被逼的</text><rect x="500" y="80" width="310" height="320" rx="32" fill="#fff" stroke="#E8DDD3" stroke-width="3"/><text x="655.0" y="126.0" text-anchor="middle" font-size="20" font-weight="700" fill="#8A7F78">🕘 21:00</text><rect x="525" y="150" width="260" height="90" rx="18" fill="#E1F3E8"/><text x="655.0" y="188.0" text-anchor="middle" font-size="17" font-weight="700" fill="#3A3330">这个 project 我很在意，</text><text x="655.0" y="216.0" text-anchor="middle" font-size="17" font-weight="700" fill="#3A3330">花五分钟回一下 OK。</text><text x="655.0" y="310.0" text-anchor="middle" font-size="54" font-weight="400" fill="#3A3330">😊</text><rect x="595" y="340" width="120" height="36" rx="18" fill="#6DBE8C"/><text x="655.0" y="364.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">自己选的</text><text x="460.0" y="250.0" text-anchor="middle" font-size="28" font-weight="700" fill="#8A7F78">vs</text><text x="460.0" y="440.0" text-anchor="middle" font-size="19" font-weight="700" fill="#3A3330">做的事一样，感觉完全不一样 —— 差别是：是不是自己选的</text></svg>